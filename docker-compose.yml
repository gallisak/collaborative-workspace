name: collab-docs

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'false'
  TRUST_PROXY: ${TRUST_PROXY:-1}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-collab}:${POSTGRES_PASSWORD:-collab}@postgres:5432/${POSTGRES_DB:-collab_docs}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-collab-docs}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret-change-me}
  REVALIDATE_URL: http://web:3000/internal/revalidate
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret-change-me}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-dev-billing-webhook-secret-change-me}

x-backend-deps: &backend-deps
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab}
      POSTGRES_DB: ${POSTGRES_DB:-collab_docs}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@localhost:9000
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', '/usr/bin/mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:-collab-docs}']
    restart: 'no'

  migrate:
    build:
      context: ./backend
      target: migrate
    command:
      ['sh', '-c', 'npx prisma migrate deploy && if [ "$$SEED_DEMO_DATA" = "true" ]; then npx prisma db seed; fi']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collab}:${POSTGRES_PASSWORD:-collab}@postgres:5432/${POSTGRES_DB:-collab_docs}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-env
      API_PORT: 4000
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *backend-deps

  collab:
    build:
      context: ./backend
      target: runtime
    command: ['node', 'dist/collab.js']
    environment:
      <<: *backend-env
      COLLAB_PORT: 4001
    ports:
      - '127.0.0.1:${COLLAB_PORT:-4001}:4001'
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *backend-deps

  worker:
    build:
      context: ./backend
      target: runtime
    command: ['node', 'dist/worker.js']
    environment:
      <<: *backend-env
      WORKER_PORT: 4002
    ports:
      - '127.0.0.1:${WORKER_PORT:-4002}:4002'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4002/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *backend-deps

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:4001}
    environment:
      API_INTERNAL_URL: http://api:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret-change-me}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/login']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
